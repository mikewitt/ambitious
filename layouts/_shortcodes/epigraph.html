{{ $source := .Get "source" -}}

<blockquote class="
    col-span-2 
    max-w-[calc(100%-5rem)] 
    ml-auto 
    text-right 
    italic 
    text-lg 
    my-8 
    py-4 
    border-y 
    border-gray-400 
    dark:border-gray-600
"
>
    <p class="epigraph-text">
        {{ .Inner | markdownify }}
    </p>
    
    {{ if $source }}
        <footer class="
            epigraph-source 
            block 
            text-sm 
            mt-2 
            text-gray-600 
            dark:text-gray-400 
            not-italic
        ">
            — {{ $source }}
        </footer>
    {{ end }}
</blockquote>
