    class="sticky block text-right
    w-max ml-auto top-24 max-h-[calc(100vh-8rem)] overflow-y-auto overscroll-contain
    rounded-lg text-sm">

  <div class="py-2 px-4">
    {{ .TableOfContents }}

</details>
